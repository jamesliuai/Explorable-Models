[package]
name = "study-harness-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Validates Study Harness activity records against the JSON Schemas emitted by @explorable-models/activity."
license = "MIT"
publish = false

# Standalone: never join a parent Cargo workspace.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "validate-fixtures"
path = "src/bin/validate-fixtures.rs"

[dependencies]
jsonschema = { version = "0.60.1", default-features = false }
serde_json = "1.0.145"
sha2 = "0.10"
